name: Publish game for portfolio

# Keeps the playable game in the portfolio (vicky-game.vercel.app/monster-merge/)
# in sync with this repository, which stays the single source of truth.
#
# On every push to main that touches game/, this exports the Web build, packages
# it for the portfolio's case study page (tools/portfolio_play/) and publishes it,
# with a version.json naming the source commit, as the only commit on the
# `portfolio-play` branch (force-pushed, so old builds don't pile up in history).
# The portfolio downloads that branch on every Vercel build.
#
# If the repository secret PORTFOLIO_DEPLOY_HOOK holds a Vercel Deploy Hook URL
# for the portfolio project, the portfolio is redeployed straight away.
# The game's Supabase config is used as committed (publishable key only).
on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "tools/portfolio_play/**"
      - ".github/workflows/publish-portfolio-game.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-play
  cancel-in-progress: true

env:
  # Must match the editor version the project is saved with (same as deploy-game-pages.yml).
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "stable"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot and Web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$dest"
          mv /tmp/templates/templates/* "$dest/"

      - name: Build and package the game
        run: |
          GODOT=~/godot/godot tools/portfolio_play/build_portfolio_play.sh "$RUNNER_TEMP/play"
          cat > "$RUNNER_TEMP/play/version.json" <<JSON
          {"commit": "${GITHUB_SHA}", "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"}
          JSON
          cat "$RUNNER_TEMP/play/version.json"

      - name: Publish to the portfolio-play branch
        working-directory: ${{ runner.temp }}/play
        run: |
          git init -q -b portfolio-play
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Portfolio game build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" portfolio-play

      - name: Redeploy the portfolio
        env:
          HOOK: ${{ secrets.PORTFOLIO_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::PORTFOLIO_DEPLOY_HOOK is not set; the portfolio picks up this build on its next deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Portfolio redeploy requested."
