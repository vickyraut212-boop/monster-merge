name: Deploy Supabase

# Applies database migrations and deploys Edge Functions from supabase/ to the
# hosted project on every push to main that touches supabase/.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Check secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        # CLI 3.x targets the local stack by default; --remote uses the linked project.
        run: supabase db push --remote

      - name: Deploy Edge Functions
        run: |
          # Every folder in supabase/functions except shared code (names starting with "_").
          functions=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '%f\n' 2>/dev/null)
          if [ -z "$functions" ]; then
            echo "No Edge Functions to deploy."
          else
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          fi
